<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piero Aviator Bot — Admin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.header { background: #1e293b; padding: 18px 28px; border-bottom: 1px solid #334155; }
.header h1 { color: #38bdf8; font-size: 18px; }
.header p  { color: #64748b; font-size: 12px; margin-top: 2px; }
.container { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 18px; margin-bottom: 18px; }
.card h2 { font-size: 11px; color: #64748b; margin-bottom: 14px; text-transform: uppercase; letter-spacing: .8px; }
label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 7px 10px; color: #e2e8f0; font-size: 13px; font-family: monospace; }
textarea { height: 90px; resize: vertical; }
input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
.row { display: flex; gap: 10px; margin-bottom: 10px; }
.row > * { flex: 1; }
button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: opacity .15s; }
button:hover { opacity: .82; }
.btn-blue  { background: #0284c7; color: #fff; }
.btn-green { background: #16a34a; color: #fff; }
.btn-red   { background: #dc2626; color: #fff; }
.msg { margin-top: 8px; padding: 7px 11px; border-radius: 6px; font-size: 12px; display: none; }
.msg.ok  { background: #14532d; color: #86efac; display: block; }
.msg.err { background: #450a0a; color: #fca5a5; display: block; }
.stat-row { display: flex; gap: 12px; margin-bottom: 18px; }
.stat { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px 18px; flex: 1; text-align: center; }
.stat .val { font-size: 24px; font-weight: 700; color: #38bdf8; }
.stat .lbl { font-size: 11px; color: #64748b; margin-top: 3px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 8px 10px; background: #0f172a; color: #475569; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
td { padding: 9px 10px; border-top: 1px solid #0f172a; }
tr:hover td { background: #162032; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
.badge.active   { background: #14532d; color: #86efac; }
.badge.inactive { background: #1e293b; color: #64748b; border: 1px solid #334155; }
.mono { font-family: monospace; font-size: 11px; color: #94a3b8; }
.reset-btn { background: none; border: 1px solid #dc2626; color: #f87171; padding: 2px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }
.reset-btn:hover { background: #450a0a; }
</style>
</head>
<body>
<div class="header">
  <h1>✈ Piero Aviator Bot — Admin Panel</h1>
  <p>Lisans Yönetimi</p>
</div>
<div class="container">

  <div class="card">
    <h2>Admin Girişi</h2>
    <div class="row">
      <div>
        <label>Admin Şifresi</label>
        <input type="password" id="adminPass" placeholder="Şifrenizi girin" onkeydown="if(event.key==='Enter') loadLicenses()">
      </div>
      <div style="display:flex;align-items:flex-end">
        <button class="btn-blue" onclick="loadLicenses()">Giriş Yap</button>
      </div>
    </div>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div class="stat-row" id="statsRow" style="display:none">
    <div class="stat"><div class="val" id="statTotal">0</div><div class="lbl">Toplam Lisans</div></div>
    <div class="stat"><div class="val" id="statActive">0</div><div class="lbl">Aktif Lisans</div></div>
    <div class="stat"><div class="val" id="statRuns">0</div><div class="lbl">Toplam Çalışma</div></div>
  </div>

  <div class="card">
    <h2>Yeni Lisans Ekle</h2>
    <div class="row">
      <div>
        <label>Lisans Anahtarları (her satıra bir anahtar)</label>
        <textarea id="newKeys" placeholder="PIERO-1234-5678-9012"></textarea>
      </div>
      <div>
        <label>Not (müşteri adı vb.)</label>
        <input type="text" id="noteField" placeholder="Örn: Müşteri Ahmet">
        <button class="btn-green" style="margin-top:8px;width:100%" onclick="addKeys()">Ekle</button>
      </div>
    </div>
    <div id="addMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Lisans Sıfırla  (başka bilgisayara taşımak için)</h2>
    <div class="row">
      <div>
        <label>Sıfırlanacak Anahtar</label>
        <input type="text" id="resetKey" placeholder="PIERO-0000-0000-0000">
      </div>
      <div style="display:flex;align-items:flex-end">
        <button class="btn-red" onclick="doResetField()">Sıfırla</button>
      </div>
    </div>
    <div id="resetMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Lisans Listesi</h2>
    <div id="licenseTable"><p style="color:#475569;font-size:12px">Giriş yapın.</p></div>
  </div>

</div>
<script>
const SERVER = window.location.origin;

async function api(endpoint, body) {
  const r = await fetch(SERVER + endpoint, {
    method: body ? 'POST' : 'GET',
    headers: {'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined
  });
  return r.json();
}

function showMsg(id, text, ok) {
  const el = document.getElementById(id);
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
}

async function loadLicenses() {
  const pass = document.getElementById('adminPass').value;
  if (!pass) { showMsg('loginMsg','Şifre giriniz.',false); return; }
  try {
    const r = await fetch(SERVER + '/admin/list?password=' + encodeURIComponent(pass));
    const d = await r.json();
    if (!d.ok) { showMsg('loginMsg', d.msg || 'Hata', false); return; }
    showMsg('loginMsg', d.total + ' lisans yüklendi.', true);
    const active = d.licenses.filter(l => l.activated).length;
    const runs   = d.licenses.reduce((s, l) => s + (l.total_runs || 0), 0);
    document.getElementById('statTotal').textContent  = d.total;
    document.getElementById('statActive').textContent = active;
    document.getElementById('statRuns').textContent   = runs;
    document.getElementById('statsRow').style.display = 'flex';
    renderTable(d.licenses, pass);
  } catch { showMsg('loginMsg','Sunucuya bağlanılamadı.',false); }
}

function renderTable(licenses, pass) {
  if (!licenses.length) {
    document.getElementById('licenseTable').innerHTML = '<p style="color:#475569;font-size:12px">Lisans yok.</p>';
    return;
  }
  let html = `<table><thead><tr>
    <th>Anahtar</th><th>Durum</th><th>Aktive Tarihi</th>
    <th>Son Açılış</th><th>Son Süre</th><th>Çalışma Sayısı</th>
    <th>Not</th><th></th>
  </tr></thead><tbody>`;
  for (const l of licenses) {
    html += `<tr>
      <td class="mono">${l.key}</td>
      <td><span class="badge ${l.activated?'active':'inactive'}">${l.activated?'Aktif':'Bekliyor'}</span></td>
      <td class="mono">${l.activated_at?l.activated_at.replace('T',' '):'—'}</td>
      <td class="mono" style="color:#cbd5e1">${l.last_opened||'—'}</td>
      <td class="mono" style="color:#34d399;font-weight:600">${l.last_runtime||'—'}</td>
      <td style="text-align:center;color:#38bdf8;font-weight:700">${l.total_runs||0}</td>
      <td style="color:#64748b;font-size:11px">${l.note||'—'}</td>
      <td>${l.activated?`<button class="reset-btn" onclick="doReset('${l.key}','${pass}')">Sıfırla</button>`:'—'}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('licenseTable').innerHTML = html;
}

async function addKeys() {
  const pass = document.getElementById('adminPass').value;
  const raw  = document.getElementById('newKeys').value;
  const note = document.getElementById('noteField').value;
  const keys = raw.split('\n').map(k=>k.trim()).filter(k=>k);
  if (!pass||!keys.length){showMsg('addMsg','Şifre ve anahtar gerekli.',false);return;}
  const d = await api('/admin/add',{password:pass,keys,note});
  if(d.ok){showMsg('addMsg',`✓ ${d.added.length} eklendi`,true);loadLicenses();}
  else showMsg('addMsg',d.msg||'Hata',false);
}

async function doResetField() {
  const pass = document.getElementById('adminPass').value;
  const key  = document.getElementById('resetKey').value.toUpperCase().trim();
  if(!pass||!key){showMsg('resetMsg','Şifre ve anahtar gerekli.',false);return;}
  const d = await api('/admin/reset',{password:pass,key});
  showMsg('resetMsg',d.msg||(d.ok?'Sıfırlandı':'Hata'),d.ok);
  if(d.ok)loadLicenses();
}

async function doReset(key,pass) {
  if(!confirm(key+' sıfırlansın mı?'))return;
  const d = await api('/admin/reset',{password:pass,key});
  alert(d.msg);
  loadLicenses();
}
</script>
</body>
</html>
